---
- name: In-Place Upgrades (leapp) — Advanced Solve
  hosts: leapp
  gather_facts: true
  become: true

  tasks:

    - name: Run workshop-leapp-checkhost.sh
      ansible.builtin.shell: workshop-leapp-checkhost.sh
      register: r_checkhost
      changed_when: false
      failed_when: r_checkhost.rc != 0

    - name: Assert host is running RHEL 9
      ansible.builtin.assert:
        that: ansible_facts['distribution_major_version'] == '9'
        fail_msg: "Host is running RHEL {{ ansible_facts['distribution_major_version'] }}, expected RHEL 9"
        success_msg: "Host confirmed as RHEL 9"

    - name: Install leapp-upgrade package
      ansible.builtin.dnf:
        name: leapp-upgrade
        state: present

    - name: Remove previous leapp run artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/log/leapp
        - /root/tmp_leapp_py3

    - name: Upgrade all packages to latest (pre-leapp)
      ansible.builtin.dnf:
        name: '*'
        state: latest
      async: 600
      poll: 20

    - name: Reboot after dnf upgrade
      ansible.builtin.reboot:
        reboot_timeout: 120
        connect_timeout: 10

    # First preupgrade run — inhibitor (Not enough space on /boot) is expected
    - name: Run leapp preupgrade (first pass — inhibitor expected)
      ansible.builtin.shell: leapp preupgrade
      register: r_preupgrade1
      async: 600
      poll: 20
      ignore_errors: true
      changed_when: false

    # Remove the lab-placed bigfile that causes the /boot space inhibitor
    - name: Remove /boot/bigfile (lab inhibitor)
      ansible.builtin.file:
        path: /boot/bigfile
        state: absent

    # Second preupgrade — should show Inhibitors: 0
    - name: Run leapp preupgrade (second pass — expect Inhibitors 0)
      ansible.builtin.shell: leapp preupgrade
      register: r_preupgrade2
      async: 600
      poll: 20
      changed_when: false

    - name: Assert second preupgrade has no inhibitors
      ansible.builtin.assert:
        that: "'Inhibitors:                  0' in r_preupgrade2.stdout or 'Inhibitor' not in r_preupgrade2.stdout"
        fail_msg: "leapp preupgrade still shows inhibitors — check /var/log/leapp/leapp-report.txt"
        success_msg: "No inhibitors found — proceeding with leapp upgrade"
      ignore_errors: true

    # Phase 1 upgrade (prepares initramfs + repos) — do NOT use 'time' prefix
    - name: Run leapp upgrade (phase 1 — async ~10 min)
      ansible.builtin.shell: leapp upgrade
      register: r_upgrade
      async: 900
      poll: 30
      changed_when: true

    # Phase 2 upgrade completes during this reboot (initramfs, ~6-9 min)
    - name: Reboot to complete leapp upgrade (phase 2 in initramfs)
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 15

    # Post-reboot validation
    - name: Re-gather facts (post-upgrade)
      ansible.builtin.setup:

    - name: Assert system is now RHEL 10
      ansible.builtin.assert:
        that: ansible_facts['distribution_major_version'] == '10'
        fail_msg: "Upgrade failed — host is still RHEL {{ ansible_facts['distribution_major_version'] }}"
        success_msg: "Upgrade successful — host is now RHEL {{ ansible_facts['distribution_version'] }}"

    - name: Get kernel version post-upgrade
      ansible.builtin.command: uname -r
      register: r_uname
      changed_when: false

    - name: Assert kernel is RHEL 10
      ansible.builtin.assert:
        that: "'.el10' in r_uname.stdout"
        fail_msg: "Kernel {{ r_uname.stdout }} does not appear to be RHEL 10"
        success_msg: "RHEL 10 kernel confirmed: {{ r_uname.stdout }}"

    - name: Verify RHEL 10 repos in dnf repolist
      ansible.builtin.command: dnf repolist
      register: r_repolist
      changed_when: false

    - name: Assert RHEL 10 repos are present
      ansible.builtin.assert:
        that: "'rhel-10-for-x86_64' in r_repolist.stdout"
        fail_msg: "RHEL 10 repos not found in dnf repolist"
        success_msg: "RHEL 10 repos confirmed"
      ignore_errors: true

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          checkhost rc==0        : {{ 'ok' if r_checkhost.rc == 0 else 'NOT ok' }}
          RHEL version           : {{ ansible_facts['distribution_version'] | default('unknown') }}
          kernel                 : {{ r_uname.stdout | default('unknown') }}
          RHEL 10 kernel         : {{ 'ok' if '.el10' in (r_uname.stdout | default('')) else 'NOT ok' }}
          RHEL 10 repos          : {{ 'ok' if 'rhel-10-for-x86_64' in (r_repolist.stdout | default('')) else 'NOT ok' }}
