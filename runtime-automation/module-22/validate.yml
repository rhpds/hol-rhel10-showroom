---
- name: In-Place Upgrades (leapp) Validation
  hosts: leapp
  gather_facts: false
  become: true

  tasks:

    # -------------------------------------------------------
    # Check 1 — Gather facts (post-upgrade OS info)
    # -------------------------------------------------------
    - name: Gather system facts
      ansible.builtin.setup:
        gather_subset:
          - distribution
      register: r_setup
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — Kernel version contains .el10 pattern
    # -------------------------------------------------------
    - name: Get running kernel version
      ansible.builtin.command: uname -r
      register: r_uname
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — RHEL 10 repos present in dnf repolist
    # -------------------------------------------------------
    - name: Get dnf repolist
      ansible.builtin.command: dnf repolist
      register: r_repolist
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — /boot/bigfile does NOT exist (lab inhibitor removed)
    # -------------------------------------------------------
    - name: Check /boot/bigfile is absent
      ansible.builtin.stat:
        path: /boot/bigfile
      register: r_bigfile
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — /var/log/leapp/leapp-report.txt exists (preupgrade ran)
    # -------------------------------------------------------
    - name: Check leapp-report.txt exists
      ansible.builtin.stat:
        path: /var/log/leapp/leapp-report.txt
      register: r_leapp_report
      ignore_errors: true

    # -------------------------------------------------------
    # Build results
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ (ansible_facts['distribution_major_version'] | default('')) == '10' }}"
        _task2_ok: "{{ '.el10' in (r_uname.stdout | default('')) }}"
        _task3_ok: "{{ 'rhel-10-for-x86_64-baseos-rpms' in (r_repolist.stdout | default('')) }}"
        _task4_ok: "{{ not (r_bigfile.stat.exists | default(false)) }}"
        _task5_ok: "{{ r_leapp_report.stat.exists | default(false) }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Fail if any task check did not pass
      ansible.builtin.fail:
        msg: |
          One or more validation checks FAILED:
          {{ 'OK' if _task1_ok else 'FAILED' }} Task 1: Host must be RHEL 10 — current version is '{{ ansible_facts['distribution_major_version'] | default('unknown') }}'. Run Solve or complete the leapp upgrade and reboot.
          {{ 'OK' if _task2_ok else 'FAILED' }} Task 2: Kernel must contain .el10 — got '{{ r_uname.stdout | default('unknown') }}'. Ensure the upgrade reboot completed.
          {{ 'OK' if _task3_ok else 'FAILED' }} Task 3: rhel-10-for-x86_64-baseos-rpms not found in dnf repolist — the upgrade may not have completed successfully.
          {{ 'OK' if _task4_ok else 'FAILED' }} Task 4: /boot/bigfile still exists — remove it with: rm -f /boot/bigfile, then re-run leapp preupgrade.
          {{ 'OK' if _task5_ok else 'FAILED' }} Task 5: /var/log/leapp/leapp-report.txt missing — run leapp preupgrade on the leapp host first.
      when: not (_task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok)

    - name: All validation checks passed
      ansible.builtin.debug:
        msg: |
          Task 1: Host is RHEL 10 (distribution_major_version == '10')
          Task 2: Kernel is RHEL 10 ({{ r_uname.stdout | default('unknown') }} contains .el10)
          Task 3: RHEL 10 BaseOS repo present in dnf repolist
          Task 4: /boot/bigfile removed (lab inhibitor cleared)
          Task 5: /var/log/leapp/leapp-report.txt exists (leapp preupgrade ran)
      when: _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok
