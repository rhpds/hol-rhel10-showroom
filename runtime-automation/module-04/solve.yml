---
- name: Firewall Management pt.1 (firewalld) — Fundamental Solve
  hosts: node1
  gather_facts: false
  become: true
  vars:
    firewalld_zone: public

  tasks:

    - name: Run workshop-firewalld-checkhost.sh
      ansible.builtin.command: workshop-firewalld-checkhost.sh
      register: r_checkhost
      changed_when: false
      failed_when: r_checkhost.rc != 0

    # Add http and https as separate tasks (lab uses brace expansion which is bash-only)
    - name: Add http service to public zone (runtime)
      ansible.posix.firewalld:
        service: http
        zone: "{{ firewalld_zone }}"
        state: enabled
        permanent: false
        immediate: true
      register: r_http_runtime
      ignore_errors: true

    - name: Add https service to public zone (runtime)
      ansible.posix.firewalld:
        service: https
        zone: "{{ firewalld_zone }}"
        state: enabled
        permanent: false
        immediate: true
      register: r_https_runtime
      ignore_errors: true

    - name: Persist runtime config to permanent (firewall-cmd --runtime-to-permanent)
      ansible.builtin.shell: firewall-cmd --runtime-to-permanent
      register: r_runtime_to_permanent
      changed_when: r_runtime_to_permanent.rc == 0
      ignore_errors: true

    - name: Remove dhcpv6-client service from public zone (runtime + permanent)
      ansible.posix.firewalld:
        service: dhcpv6-client
        zone: "{{ firewalld_zone }}"
        state: disabled
        permanent: true
        immediate: true
      register: r_dhcpv6_removed
      ignore_errors: true

    - name: Run workshop-finish-exercise.sh
      ansible.builtin.shell: SUDO_USER=ztrunner workshop-finish-exercise.sh
      become: false
      register: r_finish
      changed_when: false
      ignore_errors: true

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          checkhost            : {{ 'ok' if r_checkhost.rc == 0 else 'NOT ok (rc=' ~ r_checkhost.rc ~ ')' }}
          http (runtime)       : {{ 'ok' if r_http_runtime is not failed else 'NOT ok' }}
          https (runtime)      : {{ 'ok' if r_https_runtime is not failed else 'NOT ok' }}
          runtime-to-permanent : {{ 'ok' if r_runtime_to_permanent.rc == 0 else 'NOT ok (rc=' ~ r_runtime_to_permanent.rc ~ ')' }}
          dhcpv6-client removed: {{ 'ok' if r_dhcpv6_removed is not failed else 'NOT ok' }}
          finish-exercise      : {{ 'ok' if r_finish.rc == 0 else 'NOT ok (rc=' ~ r_finish.rc ~ ') [ignored]' }}
