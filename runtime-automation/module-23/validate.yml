---
- name: Boot Mgmt (boom) Validation
  hosts: node3
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    # -------------------------------------------------------
    # Check 1 — boom profile exists for RHEL 10.0 (Coughlan)
    # -------------------------------------------------------
    - name: Check boom profile for RHEL 10.0 (Coughlan)
      ansible.builtin.shell: >
        boom profile list --osversion "10.0 (Coughlan)" 2>/dev/null | grep -i coughlan && echo ok || echo missing
      register: r_profile
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — boom entry with title 'RHEL 10 Workshop' exists
    # -------------------------------------------------------
    - name: Check boom entry titled 'RHEL 10 Workshop' exists
      ansible.builtin.shell: >
        boom entry list --title "RHEL 10 Workshop" 2>/dev/null | grep -i "Workshop" && echo ok || echo missing
      register: r_entry
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — the Workshop boom entry carries custom_value=true in its options
    #           Parse the entry's bootid then inspect it
    # -------------------------------------------------------
    - name: Check custom_value=true is present in the Workshop boot entry options
      ansible.builtin.shell: |
        BOOTID=$(boom entry list --title "RHEL 10 Workshop" -o bootid,title 2>/dev/null | grep -m1 Workshop | awk '{print $1}')
        if [ -z "$BOOTID" ]; then
          echo missing
        else
          boom entry show "$BOOTID" 2>/dev/null | grep "custom_value=true" && echo ok || echo missing
        fi
      register: r_entry_custom
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — grubby --default-title returns 'RHEL 10 Workshop'
    # -------------------------------------------------------
    - name: Check grubby --default-title is 'RHEL 10 Workshop'
      ansible.builtin.shell: >
        grubby --default-title 2>/dev/null | grep -Fx "RHEL 10 Workshop" && echo ok || echo missing
      register: r_default_title
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — /proc/cmdline contains custom_value=true (post-reboot)
    # -------------------------------------------------------
    - name: Check /proc/cmdline contains custom_value=true
      ansible.builtin.shell: >
        grep -q "custom_value=true" /proc/cmdline && echo ok || echo missing
      register: r_cmdline
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Build task results
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ 'ok' in (r_profile.stdout | default('missing')) }}"
        _task2_ok: "{{ 'ok' in (r_entry.stdout | default('missing')) }}"
        _task3_ok: "{{ 'ok' in (r_entry_custom.stdout | default('missing')) }}"
        _task4_ok: "{{ 'ok' in (r_default_title.stdout | default('missing')) }}"
        _task5_ok: "{{ 'ok' in (r_cmdline.stdout | default('missing')) }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Fail if any task check did not pass
      ansible.builtin.fail:
        msg: |
          One or more validation checks FAILED:
          {{ 'Task 1: boom profile for RHEL 10.0 (Coughlan) exists' if _task1_ok else 'Task 1: RHEL 10.0 (Coughlan) boom profile missing — run: sudo workshop-boom-mkprofile.sh' }}
          {{ 'Task 2: boom entry titled RHEL 10 Workshop exists' if _task2_ok else 'Task 2: RHEL 10 Workshop boom entry missing — run: sudo workshop-boom-mkentry-custom.sh' }}
          {{ 'Task 3: Workshop boot entry includes custom_value=true' if _task3_ok else 'Task 3: custom_value=true not found in Workshop entry options — run: sudo workshop-boom-mkentry-custom.sh' }}
          {{ 'Task 4: grubby --default-title is RHEL 10 Workshop' if _task4_ok else 'Task 4: Default GRUB entry is not RHEL 10 Workshop — run: grubby --set-default=<index> using the Workshop entry index from workshop-boom-grublist.sh' }}
          {{ 'Task 5: /proc/cmdline contains custom_value=true' if _task5_ok else 'Task 5: node3 has not rebooted into the Workshop entry — reboot node3 or click Solve to complete the reboot step' }}
      when: not (_task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok)

    - name: All validation checks passed
      ansible.builtin.debug:
        msg: |
          Task 1: boom profile for RHEL 10.0 (Coughlan) exists
          Task 2: boom entry titled 'RHEL 10 Workshop' exists
          Task 3: Workshop boot entry includes custom_value=true
          Task 4: grubby --default-title is 'RHEL 10 Workshop'
          Task 5: /proc/cmdline contains custom_value=true (node3 booted into Workshop entry)
      when: _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok
