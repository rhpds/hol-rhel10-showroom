---
# Module 23 — Boot Management (boom) Solve
# Two reboots:
#   Play 1: ssh node3 sudo reboot (initial, from bastion)
#   Play 4: ansible.builtin.reboot on node3 (load custom_value=true entry)
# workshop-finish-exercise.sh runs on BASTION at the end

- name: Boom Solve — initial reboot of node3 from bastion
  hosts: bastion
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:
    - name: Reboot node3 via ssh (fire-and-forget)
      ansible.builtin.shell: >
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10
        -i /app/.ssh/id_rsa -F /app/.ssh/config
        node3 sudo reboot
      ignore_errors: true

    - name: Wait for node3 to come back after initial reboot
      ansible.builtin.wait_for:
        host: node3
        port: 22
        delay: 15
        sleep: 5
        timeout: 120
        state: started
      ignore_errors: true

- name: Boom Solve — Core Concepts on node3
  hosts: node3
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    - name: Run workshop-boom-checkhost.sh to verify correct host
      ansible.builtin.shell: workshop-boom-checkhost.sh
      register: r_checkhost
      changed_when: false
      ignore_errors: true

    - name: Verify GRUB_ENABLE_BLSCFG is true
      ansible.builtin.shell: grep BLSCFG /etc/default/grub
      register: r_blscfg
      changed_when: false
      ignore_errors: true

    - name: List existing boom profiles (informational)
      ansible.builtin.shell: boom profile list
      register: r_profile_list_before
      changed_when: false
      ignore_errors: true

    - name: Run workshop-boom-mkprofile.sh to create RHEL 10 boom profile
      ansible.builtin.shell: workshop-boom-mkprofile.sh
      register: r_mkprofile
      changed_when: true
      ignore_errors: true

    - name: Verify boom profile exists for RHEL 10.0 (Coughlan)
      ansible.builtin.shell: boom profile list --osversion "10.0 (Coughlan)"
      register: r_profile_coughlan
      changed_when: false
      ignore_errors: true

    - name: Run workshop-boom-mkentry.sh (Core Concepts boot entry)
      ansible.builtin.shell: workshop-boom-mkentry.sh
      register: r_mkentry
      changed_when: true
      ignore_errors: true

    - name: Delete Core Concepts RHEL 10 Workshop boot entry
      ansible.builtin.shell: |
        BOOM_BOOTID=$(boom entry list --title "RHEL 10 Workshop" -o bootid,title | grep -m 1 Workshop | awk '{print $1}')
        if [ -n "$BOOM_BOOTID" ]; then
          boom entry delete "$BOOM_BOOTID"
        else
          echo "No RHEL 10 Workshop entry found to delete"
        fi
      register: r_entry_delete
      changed_when: "'Deleted' in r_entry_delete.stdout"
      ignore_errors: true

- name: Boom Solve — Custom Kernel Options exercise on node3
  hosts: node3
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    - name: Run workshop-boom-mkentry-custom.sh (primary exercise — custom_value=true)
      ansible.builtin.shell: workshop-boom-mkentry-custom.sh
      register: r_mkentry_custom
      changed_when: true
      ignore_errors: true

    - name: Run workshop-boom-grublist.sh to list GRUB menu entries
      ansible.builtin.shell: workshop-boom-grublist.sh
      register: r_grublist
      changed_when: false
      ignore_errors: true

    # Safety assert: grubby must show /boot/ paths before setting default
    - name: Get grubby info for Workshop GRUB entry
      ansible.builtin.shell: |
        grubby --info=$(workshop-boom-grublist.sh | grep -m1 "Workshop" | awk '{print $1}')
      register: r_grubby_info
      changed_when: false
      ignore_errors: true

    - name: Assert grubby shows /boot/ paths (safety check)
      ansible.builtin.assert:
        that:
          - "'/boot/vmlinuz-' in r_grubby_info.stdout"
          - "'/boot/initramfs-' in r_grubby_info.stdout"
        fail_msg: >
          SAFETY ABORT: grubby output does not contain /boot/-prefixed kernel or initramfs paths.
          Output was: {{ r_grubby_info.stdout }}
        success_msg: "grubby /boot/ path check passed — safe to set default"

    - name: Set GRUB default to RHEL 10 Workshop entry
      ansible.builtin.shell: |
        eval $(grubby --info=$(workshop-boom-grublist.sh | grep -m1 "Workshop" | awk '{print $1}') | grep index)
        grubby --set-default=$index
      register: r_set_default
      changed_when: true
      ignore_errors: true

    - name: Verify grubby default title is RHEL 10 Workshop
      ansible.builtin.shell: grubby --default-title
      register: r_default_title
      changed_when: false
      ignore_errors: true

    - name: Assert default title is RHEL 10 Workshop
      ansible.builtin.assert:
        that:
          - "'RHEL 10 Workshop' in r_default_title.stdout"
        fail_msg: "Default title is '{{ r_default_title.stdout }}' — expected 'RHEL 10 Workshop'"
        success_msg: "Default GRUB title correctly set to RHEL 10 Workshop"

- name: Boom Solve — reboot node3 to load custom_value=true entry
  hosts: node3
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:
    - name: Reboot node3 to activate RHEL 10 Workshop boot entry
      ansible.builtin.reboot:
        reboot_timeout: 120
        connect_timeout: 10
        msg: "Rebooting to load RHEL 10 Workshop boot entry (custom_value=true)"

- name: Boom Solve — post-reboot validation on node3
  hosts: node3
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    - name: Read /proc/cmdline after reboot
      ansible.builtin.shell: cat /proc/cmdline
      register: r_cmdline
      changed_when: false
      ignore_errors: true

    - name: Assert /proc/cmdline contains custom_value=true
      ansible.builtin.assert:
        that:
          - "'custom_value=true' in r_cmdline.stdout"
        fail_msg: >
          /proc/cmdline does not contain 'custom_value=true'.
          Actual cmdline: {{ r_cmdline.stdout }}
        success_msg: "custom_value=true confirmed in /proc/cmdline — custom boot entry active"

- name: Boom Solve — finish exercise on bastion
  hosts: bastion
  gather_facts: false
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    - name: Run workshop-finish-exercise.sh on bastion to reset terminal session
      ansible.builtin.shell: SUDO_USER=ztrunner workshop-finish-exercise.sh
      become: false
      register: r_finish
      changed_when: false
      ignore_errors: true

    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          finish-exercise: {{ 'ok' if r_finish.rc == 0 else 'NOT ok (check manually)' }}
          custom_value=true: see node3 play for /proc/cmdline validation
