---
- name: Storage DeDup (lvm, vdo) Validation
  hosts: node3
  gather_facts: false
  become: true

  tasks:

    # -------------------------------------------------------
    # Check 1 — vdo package installed
    # -------------------------------------------------------
    - name: Check vdo package is installed
      ansible.builtin.command: rpm -q vdo
      register: r_vdo_pkg
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — lv_raid10 LV exists in vg_lab
    # After lvconvert --type vdo-pool, the segtype becomes vdo-pool.
    # Accept raid10 (pre-convert) or vdo-pool (post-convert).
    # -------------------------------------------------------
    - name: Check lv_raid10 LV exists in vg_lab
      ansible.builtin.shell: >-
        lvs --noheadings -o lv_name,segtype vg_lab 2>/dev/null
        | awk '$1=="lv_raid10" && $2~/raid10|vdo-pool/{print "found"}'
      register: r_lv_raid10
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — lab2 VDO virtual LV exists in vg_lab
    # -------------------------------------------------------
    - name: Check lab2 VDO virtual LV exists in vg_lab
      ansible.builtin.shell: >-
        lvs --noheadings -o lv_name,segtype vg_lab 2>/dev/null
        | awk '$1=="lab2" && $2~/vdo/{print "found"}'
      register: r_lv_lab2
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — /dev/mapper/vg_lab-lab2 mounted at /mnt/lab2
    # -------------------------------------------------------
    - name: Check /dev/mapper/vg_lab-lab2 is mounted at /mnt/lab2
      ansible.builtin.shell: >-
        grep -q 'vg_lab-lab2.*\s/mnt/lab2\s' /proc/mounts && echo mounted || echo not_mounted
      register: r_mount
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — /mnt/lab2 has >= 3G of data (dedup scenario)
    # -------------------------------------------------------
    - name: Check data volume on /mnt/lab2 (>= 3G)
      ansible.builtin.shell: >-
        du -s /mnt/lab2 2>/dev/null | awk '{print $1}'
      register: r_du
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 6 — VDO space saving >= 90%
    # Device name: vg_lab-lv_raid10-vpool (match on partial prefix)
    # -------------------------------------------------------
    - name: Check vdostats space saving percentage
      ansible.builtin.shell: >-
        vdostats --human-readable 2>/dev/null
        | awk '/vg_lab-lv_raid10/{print $NF}'
      register: r_vdostats
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 7 — workshop-finish-exercise.sh rc == 0
    # rc=2 from pkill (ztrunner user absent) is acceptable
    # in the ztrunner environment — treat as pass.
    # -------------------------------------------------------
    - name: Check workshop-finish-exercise.sh succeeds
      ansible.builtin.shell: SUDO_USER=ztrunner workshop-finish-exercise.sh
      register: r_finish
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Build result flags
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ r_vdo_pkg.rc | default(1) == 0 }}"
        _task2_ok: "{{ 'found' in (r_lv_raid10.stdout | default('')) }}"
        _task3_ok: "{{ 'found' in (r_lv_lab2.stdout | default('')) }}"
        _task4_ok: "{{ 'mounted' in (r_mount.stdout | default('')) }}"
        _task5_ok: "{{ (r_du.stdout | default('0') | trim | int) >= 3145728 }}"
        _task6_ok: >-
          {{
            (r_vdostats.stdout | default('0%') | trim | regex_replace('%','') | int) >= 90
          }}
        # rc=0 (full pass) or rc=2 (pkill-only failure on ztrunner) both acceptable
        _task7_ok: "{{ r_finish.rc | default(1) in [0, 2] }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Fail if any task check did not pass
      ansible.builtin.fail:
        msg: |
          One or more validation checks FAILED:
          {{ '[OK]' if _task1_ok else '[FAIL]' }} Task 1: vdo package{{ '' if _task1_ok else ' NOT installed — run: dnf install -y vdo' }}
          {{ '[OK]' if _task2_ok else '[FAIL]' }} Task 2: lv_raid10 LV{{ '' if _task2_ok else ' NOT found in vg_lab — complete Phase 3 or run Solve' }}
          {{ '[OK]' if _task3_ok else '[FAIL]' }} Task 3: lab2 VDO virtual LV{{ '' if _task3_ok else ' NOT found in vg_lab — run: lvconvert --type vdo-pool --name=lab2 -V 30G vg_lab/lv_raid10 -y' }}
          {{ '[OK]' if _task4_ok else '[FAIL]' }} Task 4: /mnt/lab2 mount{{ '' if _task4_ok else ' NOT found — run: mount /dev/mapper/vg_lab-lab2 /mnt/lab2' }}
          {{ '[OK]' if _task5_ok else '[FAIL]' }} Task 5: /mnt/lab2 data{{ '' if _task5_ok else ' less than 3G — populate data or run Solve (async step, may take several minutes)' }}
          {{ '[OK]' if _task6_ok else '[FAIL]' }} Task 6: VDO space saving{{ '' if _task6_ok else ' below 90%% — data population may still be in progress; wait and validate again' }}
          {{ '[OK]' if _task7_ok else '[FAIL]' }} Task 7: finish script{{ '' if _task7_ok else ' FAILED (rc=' + (r_finish.rc | default('?') | string) + ') — check workshop-finish-exercise.sh output' }}
      when: not (_task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok and _task6_ok and _task7_ok)

    - name: All validation checks passed
      ansible.builtin.debug:
        msg: |
          Task 1: vdo package installed
          Task 2: lv_raid10 LV (RAID-10 pool) exists in vg_lab
          Task 3: lab2 VDO virtual LV exists in vg_lab
          Task 4: /dev/mapper/vg_lab-lab2 mounted at /mnt/lab2
          Task 5: /mnt/lab2 contains >= 3G of deduplication data
          Task 6: VDO space saving >= 90%% (deduplication active)
          Task 7: workshop-finish-exercise.sh completed successfully
      when: _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok and _task6_ok and _task7_ok
