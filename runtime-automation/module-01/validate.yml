---
- name: Package Management pt.1 (dnf) — Validation
  hosts: node1
  gather_facts: false
  become: true
  vars:
    ansible_user: "{{ lookup('env', 'USER') | default('lab-user') }}"
    ansible_ssh_pass: "{{ lookup('env', 'PASSWORD') | default('XRnsDtG3ZMbGPF1I') }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  tasks:

    # -------------------------------------------------------
    # Check 1 — bash-completion is installed
    # -------------------------------------------------------
    - name: Check bash-completion package is installed
      ansible.builtin.command:
        cmd: rpm -q bash-completion
      register: r_bash_completion
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — httpd is installed
    # -------------------------------------------------------
    - name: Check httpd package is installed
      ansible.builtin.command:
        cmd: rpm -q httpd
      register: r_httpd
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — mariadb is installed
    # -------------------------------------------------------
    - name: Check mariadb package is installed
      ansible.builtin.command:
        cmd: rpm -q mariadb
      register: r_mariadb
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — mariadb-server is installed
    # -------------------------------------------------------
    - name: Check mariadb-server package is installed
      ansible.builtin.command:
        cmd: rpm -q mariadb-server
      register: r_mariadb_server
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — php is removed (must NOT be installed)
    # -------------------------------------------------------
    - name: Check php package is absent
      ansible.builtin.command:
        cmd: rpm -q php
      register: r_php
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # In a student interactive session the script kills active student
    # processes (pkill -9 -u $SUDO_USER). In automation we verify:
    #   a) the script is present and executable on node1
    #   b) it can be executed without killing our ansible session
    # We call it with `become: false` and suppress errors — the script
    # is designed for interactive use and its exit code in automation
    # is not meaningful (pkill with no active processes returns non-zero).
    # The gate is satisfied if the script exists on PATH.
    # -------------------------------------------------------

    # -------------------------------------------------------
    # Build per-task boolean facts
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ r_bash_completion.rc | default(1) == 0 }}"
        _task2_ok: "{{ r_httpd.rc | default(1) == 0 }}"
        _task3_ok: "{{ r_mariadb.rc | default(1) == 0 }}"
        _task4_ok: "{{ r_mariadb_server.rc | default(1) == 0 }}"
        _task5_ok: "{{ r_php.rc | default(0) != 0 }}"

    # -------------------------------------------------------
    # Report individual task status
    # -------------------------------------------------------
    - name: Report individual task status
      ansible.builtin.debug:
        msg:
          - "Task 1 bash-completion installed : {{ 'PASS' if _task1_ok else 'FAIL' }}"
          - "Task 2 httpd installed            : {{ 'PASS' if _task2_ok else 'FAIL' }}"
          - "Task 3 mariadb installed          : {{ 'PASS' if _task3_ok else 'FAIL' }}"
          - "Task 4 mariadb-server installed   : {{ 'PASS' if _task4_ok else 'FAIL' }}"
          - "Task 5 php absent                 : {{ 'PASS' if _task5_ok else 'FAIL' }}"

    # -------------------------------------------------------
    # Fail with actionable message if any check failed
    # -------------------------------------------------------

    # -------------------------------------------------------
    # All checks passed
    # -------------------------------------------------------
